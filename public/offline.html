<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PaDónde — Modo Sin Conexión</title>
  <meta name="theme-color" content="#1c3829" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #F4F1EA;
      color: #1C3829;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid rgba(138, 126, 110, 0.25);
      border-radius: 28px;
      padding: 36px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(28, 56, 41, 0.08);
    }
    .icon-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(28, 56, 41, 0.07);
      font-size: 30px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #1C3829;
      margin-bottom: 10px;
      line-height: 1.2;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #6e6456;
      margin-bottom: 24px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFF8E6;
      border: 1px solid #FFE08A;
      color: #8F5B00;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #D9822B;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
    }
    .btn-primary {
      background: #1C3829;
      color: #FFFFFF;
      margin-bottom: 10px;
    }
    .btn-primary:active {
      transform: scale(0.98);
      background: #14281d;
    }
    .btn-secondary {
      background: transparent;
      color: #1C3829;
      border: 1px solid rgba(138, 126, 110, 0.4);
    }
    .btn-secondary:active {
      transform: scale(0.98);
      background: rgba(138, 126, 110, 0.1);
    }
    .footer-note {
      margin-top: 24px;
      font-size: 11px;
      color: #8A7E6E;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">📡</div>
    <div class="status-pill">
      <span class="pulse-dot"></span>
      <span>Sin señal en la montaña</span>
    </div>
    <h1>Modo Sin Conexión</h1>
    <p>
      La señal móvil en Minca y la Sierra a veces descansa, pero PaDónde guarda los planes que ya consultaste en tu teléfono.
    </p>

    <button type="button" class="btn btn-primary" onclick="volverACartelera()">
      <span>📲</span>
      <span>Ver Cartelera Guardada</span>
    </button>

    <button type="button" class="btn btn-secondary" onclick="window.location.reload()">
      <span>🔄</span>
      <span>Reintentar Conexión</span>
    </button>

    <p class="footer-note">
      PaDónde 🌿 Resiliencia offline para viajeros
    </p>
  </div>

  <script>
    function volverACartelera() {
      // Intenta regresar a la cartelera guardada en caché
      window.location.href = '/es/minca';
    }

    // Si vuelve la conexión automáticamente, recargar
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
